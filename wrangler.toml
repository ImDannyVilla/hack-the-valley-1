name = "hack-the-valley"
main = "./worker.js"
compatibility_date = "2026-02-17"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/events/*"]

# Reconcile blog email-blast send-log rows against Resend's real broadcast
# status (scheduled -> sending -> sent/canceled). Runs once daily; see worker.js `scheduled`.
[triggers]
crons = ["0 15 * * *"]

[vars]
MAX_UPLOAD_MB = "100"
# Resend General: HTV updates audience (segment IDs are not credentials).
RESEND_ALL_CONTACTS_SEGMENT_ID = "e2bd5d32-9a8f-4c41-add8-fa01f98d0323"

[[d1_databases]]
binding = "HTV_DB"
database_name = "hack-the-valley"
database_id = "${HTV_D1_DATABASE_ID}"

[[r2_buckets]]
binding = "SUBMISSIONS_MEDIA"
bucket_name = "hack-the-valley-submission-media"
